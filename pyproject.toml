[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sevcanwiz"
version = "0.2.0"
description = "A native desktop commissioning application for Sevcon Gen4 controllers"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
sevcanwiz = "sevcanwiz.__main__:main"

[tool.setuptools.packages.find]
include = ["sevcanwiz*"]
